<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Notes</h1>
    <form id="noteForm">
      <input id="noteInput" type="text" maxlength="500" placeholder="Write a note" required>
      <button type="submit">Add</button>
    </form>
    <p id="message"></p>
    <ul id="notes"></ul>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
